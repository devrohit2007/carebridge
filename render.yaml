# Render blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: carebridge
    runtime: node
    plan: free
    buildCommand: echo "no build step"
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: TRUST_PROXY
        value: "1"
      - key: AI_PROVIDER
        value: gemini
      - key: AI_API_KEY
        sync: false      # paste in the Render dashboard, never in git
      - key: ACCESS_CODE
        sync: false      # recommended for a public demo
